name: Validate development pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pack references and data
        run: python tools/validate_pack.py
      - name: Audit NPC requests and storyline links
        run: python tools/audit_npc_requests.py
      - name: Audit Blood Magic and early quest rewards
        run: python tools/audit_blood_progression.py
      - name: Audit late progression and finale rewards
        run: python tools/audit_late_progression.py
      - name: Preserve original legendary relic assets and behavior
        run: python tools/audit_relic_preservation.py
      - name: Check native relic packaging and memorial data
        run: python tools/audit_legendary_relics.py
      - name: Test personal World Remembers behavior
        run: node tools/tests/world_remembers.mjs
      - name: Check local development archive
        run: python tools/build_pack.py
