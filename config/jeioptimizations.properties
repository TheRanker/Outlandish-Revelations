# JEI/EMI Optimizations
# enabled=false turns the whole mod off; JEI then loads exactly as without it.
enabled=true
# Parts that can be switched off one by one.
defer_recipes=true
defer_search_index=true
threads=true
# The creative screen's first open keeps the creative tabs JEI built at the join instead of building them
# again, where the result would be the same.
reuse_creative_tabs=true
# JEI's recipe category order and visibility checks reuse what they worked out while nothing changed (JEI
# 19 and newer JEI 15 rebuilt it for every category, slow with hundreds of categories).
fix_category_order_checks=true
# R/U keeps the ingredient ids of large recipe slots once worked out, instead of working them all out again
# for every recipe on every lookup.
keep_slot_ids=true
# JEI's firework-star recipes keep their list of dye items instead of going through every item on each R/U.
keep_firework_dyes=true
# JEI shows at the join as usual; slow plugins' recipes fill it in shortly after. wait_for_recipes=true keeps
# JEI hidden until they are all in (R/U pressed early then finishes them on the spot); show_progress=true shows
# a toast and a bar while they load.
wait_for_recipes=false
show_progress=false
# A plugin step slower than this (last launch) has its recipes loaded after the join.
defer_threshold_ms=100
# The part of the after-join work that has to run on the game thread (the search index's names and
# tooltips) takes this share of each frame's time, at most frame_budget_ms per frame; finishing on
# request (R/U pressed early) uses finish_budget_ms per frame.
client_share_percent=25
frame_budget_ms=25
finish_budget_ms=50
# Pack makers: an empty file config/jeioptimizations/deep-check makes the next launch run every plugin the
# plain way and write config/jeioptimizations/plugins.json. Shipped with the pack, it lets every player's
# background results be checked against the plain way from their first launch. The file removes itself.
# The game stopping for longer than this is written to logs/jeioptimizations/decisions.log with what it was
# doing, sampled once a second. 0 = off.
stall_log_ms=1000
# 0 = number of cores minus two, at least one.
worker_threads=0
# Mod ids or plugin uids (modid:plugin), comma separated.
# never_defer: always loaded at the join as plain JEI does. never_thread: never off the client thread.
never_defer=
never_thread=
